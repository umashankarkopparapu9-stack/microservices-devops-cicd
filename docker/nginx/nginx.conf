server {
    listen 80;

    location /users {
        proxy_pass http://user-service:5000;
    }

    location /products {
        proxy_pass http://product-service:5000;
    }

    location /orders {
        proxy_pass http://order-service:5000;
    }

    location /health {
        return 200 "Nginx is healthy";
        add_header Content-Type text/plain;
    }
}
